name: CI/CD Pipeline - Absensi Digital SDN Pengampon 3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Server Dependencies
      run: npm ci || npm install

    - name: Install Client Dependencies
      run: |
        cd client
        npm ci || npm install

    - name: Run Unit Tests Automations
      run: npm test

    - name: Build Frontend Application (Vite Production)
      run: npm run build

    - name: Build Artifacts Validation
      run: |
        test -f client/dist/index.html || (echo "Build client gagal!" && exit 1)
        echo "Build berhasil diverifikasi."

